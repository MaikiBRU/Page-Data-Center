name: CI

# Runs on every push and pull request. Needs no secrets, so it works from the
# moment this file lands. The backend suite uses SQLite, so no service
# container is required.
on:
  push:
    branches: [codex/public-clean]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: pytest
        env:
          # The application refuses to start without a key. This one exists
          # only for the duration of the job and signs nothing that leaves it.
          SECRET_KEY: ci-only-key-not-used-anywhere-else-0123456789
          ENVIRONMENT: development
          DATABASE_URL: sqlite:///./ci.db
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx eslint src --ext .ts,.tsx

      # No NEXT_PUBLIC_API_URL is exported here on purpose: .env.production
      # must supply it on its own. If someone removes that file the build
      # fails here rather than in production.
      - name: next build
        run: npm run build

      - name: The bundle must point at the production API, never at localhost
        run: |
          if ! grep -rqs "api-datacenter.aaronbrumat.com.ar" .next/static/chunks/; then
            echo "::error::La URL de produccion no quedo en el bundle."
            exit 1
          fi
          if grep -rqsE "localhost:8000|127\.0\.0\.1:8000" .next/static/chunks/; then
            echo "::error::El bundle contiene una URL local."
            exit 1
          fi
          echo "Bundle correcto: apunta a la API de produccion."
